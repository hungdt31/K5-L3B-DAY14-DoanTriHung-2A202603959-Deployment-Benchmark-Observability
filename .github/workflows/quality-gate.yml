# Exercise 7.3 — Quality gate: chạy eval trên golden dataset, fail nếu accuracy < 85%.
# run_eval.py trả exit code 1 khi không đạt gate → step fail → job fail → PR không merge được
# (khi bật branch protection "Require status checks to pass" cho job `eval`).
name: quality-gate

on:
  pull_request:
    paths:
      - "06-lab-complete/benchmark-observability/develop/**"
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: 06-lab-complete/benchmark-observability/develop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: 06-lab-complete/benchmark-observability/develop/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start agent v2
        # MOCK_ERROR_RATE=0: tắt lỗi ngẫu nhiên để gate không fail vì lý do không liên quan tới chất lượng
        run: |
          AGENT_VERSION=v2 PORT=8000 MOCK_ERROR_RATE=0 python app.py > agent.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && exit 0
            sleep 1
          done
          echo "Agent không khởi động được"; cat agent.log; exit 1

      - name: Eval + quality gate (accuracy >= 85%)
        run: python eval/run_eval.py --url http://localhost:8000 --min-accuracy 0.85 --out eval_ci.json

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            06-lab-complete/benchmark-observability/develop/eval_ci.json
            06-lab-complete/benchmark-observability/develop/agent.log
